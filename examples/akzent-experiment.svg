<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">Verner’s invented word, accent 3</title>
<desc id="desc">Voicing under the older accent, then the later accent move. *agazaþ(am). All forms are hypothetical.</desc>
<rect width="1100" height="480" fill="#faf9ff"/>
<g fill="#302342" font-family="Gentium,Georgia,serif"><text x="55" y="65" font-size="26">Akzent / Verner’s explicitly invented word</text>
<text x="55" y="150" font-size="58">*akasátam</text>
<text x="490" y="150" font-size="58">*agazaþ(am)</text>
<text x="55" y="205" font-size="22">Older accent on syllable 3</text>
<text x="490" y="205" font-size="22">Hypothetical endpoint</text>
<text x="55" y="275" font-size="24">Voice under the old accent; move the accent later.</text>
<text x="55" y="325" font-size="22">Medial fricatives: *aɣazáθam</text>
<text x="55" y="380" font-size="19">A modern symbolic reworking of pp. 114–115. No form here is attested.</text>
<text x="55" y="420" font-size="19">Karl Verner, Eine ausnahme der ersten lautverschiebung, volume 23 (1877).</text></g>
<path d="M355 135h95m-18-12 18 12-18 12" fill="none" stroke="#634087" stroke-width="3"/>
</svg>